<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evento - Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <nav id="header">
    <div class="logo">Evento</div>
    <ul id="primaryNav">
      <li><a href="index2.html">Home</a></li>
      <li><a href="service.html">Service</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="price.html">Price</a></li>
      <li><a href="review.html">Review</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <!-- Contact Section -->
  <section class="contact">
    <h2 class="section-title">Get in Touch</h2>
    <div class="contact-container">
      <!-- Contact Info -->
      <div class="contact-info">
        <h3>Contact Information</h3>
        <p><i class="ri-map-pin-line"></i> 123 XXXX XXXX, West Bengal, India</p>
        <p><i class="ri-phone-line"></i> +91 00000 00000</p>
        <p><i class="ri-mail-line"></i> info@evento.com</p>
        <div class="socials">
          <a href="#"><i class="ri-facebook-fill"></i></a>
          <a href="#"><i class="ri-instagram-line"></i></a>
          <a href="#"><i class="ri-twitter-fill"></i></a>
          <a href="#"><i class="ri-linkedin-fill"></i></a>
        </div>
      </div>

      <!-- Contact Form -->
<form id="contactForm" class="contact-form">
  <input type="text" id="name" placeholder="Your Name" required>
  <input type="email" id="email" placeholder="Your Email" required>
  <textarea id="message" placeholder="Your Message" required></textarea>
  <button type="submit" class="btn">Send Message</button>
  <p id="formMessage" style="margin-top:10px; font-weight:bold;"></p>
</form>
<script>
  const API_URL = "http://localhost:5000/contact";

  const form = document.querySelector(".contact-form");
  const msgBox = document.getElementById("formMessage");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = form.querySelector("input[type=text]").value.trim();
    const email = form.querySelector("input[type=email]").value.trim();
    const message = form.querySelector("textarea").value.trim();

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, message }),
      });

      const data = await res.json();

      // ✅ Show custom message in the form
      msgBox.textContent = data.message || "✅ Message sent successfully!";
      msgBox.style.color = "green";

      form.reset();

      // Auto clear after 5 seconds
      setTimeout(() => {
        msgBox.textContent = "";
      }, 5000);

    } catch (err) {
      console.error("❌ Error:", err);
      msgBox.textContent = "❌ Error sending message. Please try again.";
      msgBox.style.color = "red";
    }
  });
</script>

  </section>
</body>
</html>
