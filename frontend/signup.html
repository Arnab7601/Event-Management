<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evento - Signup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <nav id="header">
  <div class="logo">Evento</div>
  <ul id="primaryNav">
    <li><a href="index2.html">Home</a></li>
    <li><a href="service.html">Service</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="events.html">Events</a></li>
    <li><a href="price.html">Price</a></li>
    <li><a href="review.html">Review</a></li>
    <li><a href="contact.html">Contact</a></li>

    <!-- ✅ Auth Links -->
    <li id="loginNav"><a href="login.html">Login</a></li>
    <li id="signupNav"><a href="signup.html">Signup</a></li>
    <li id="logoutNav" style="display:none;">
      <a href="#" id="logoutBtn">Logout</a>
    </li>
  </ul>
</nav>


  <!-- Signup Section -->
  <section class="auth">
    <h2 class="section-title">Signup</h2>
    <form id="signupForm">
      <input type="text" id="signupName" placeholder="Name" required>
      <input type="email" id="signupEmail" placeholder="Email" required>
      <input type="password" id="signupPassword" placeholder="Password" required>
      <button type="submit" class="btn">Signup</button>
      <p id="signupMessage"></p>
    </form>
  </section>

  <script>
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("signupName").value;
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;

      const res = await fetch("http://localhost:5000/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
      });

      const data = await res.json();
      const msg = document.getElementById("signupMessage");

      if (res.ok) {
        msg.textContent = "✅ Signup successful! Please login.";
        msg.style.color = "green";
        setTimeout(() => window.location.href = "login.html", 1000);
      } else {
        msg.textContent = "❌ " + data.message;
        msg.style.color = "red";
      }
    });
  </script>
</body>
</html>
